name: visitor-management

services:
  db:
    image: mysql:8.4
    container_name: visitor-db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+07:00
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD belum diisi di .env}"
      MYSQL_DATABASE: "${DB_DATABASE:?DB_DATABASE belum diisi di .env}"
      MYSQL_USER: "${DB_USERNAME:?DB_USERNAME belum diisi di .env}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD belum diisi di .env}"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    image: visitor-app:latest
    container_name: visitor-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "3306"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        PUBLIC_IP: "${PUBLIC_IP:-202.73.24.73}"
        PRIVATE_IP: "${PRIVATE_IP:-10.22.0.9}"
    image: visitor-web:latest
    container_name: visitor-web
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - app_storage:/var/www/html/storage:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/up || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  db_data:
  app_storage:
