services:
  # Service Container Aplikasi Laravel (PHP-FPM)
  app:
    build:
      context: .
      dockerfile: Dockerfile
      network: host   # build pakai jaringan host, bypass MTU bridge saat apt-get/composer
    container_name: vms_app
    restart: always
    env_file:
      - .env
    volumes:
      - app_public:/var/www/visitor-management-system/public
      - app_storage:/var/www/visitor-management-system/storage
    depends_on:
      - db
    networks:
      - vms_network

  # Service Container Web Server Nginx
  nginx:
    image: nginx:alpine
    container_name: vms_nginx
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - app_public:/var/www/visitor-management-system/public:ro
    depends_on:
      - app
    networks:
      - vms_network

  # Service Container Database MySQL
  db:
    image: mysql:8.0
    container_name: vms_db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "${DB_PORT:-3306}:3306"
    networks:
      - vms_network

volumes:
  app_public:
  app_storage:
  db_data:

networks:
  vms_network:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1400   # sesuaikan dengan hasil tes ping
