version: '3.8'

services:
  # Service Container Aplikasi Laravel (PHP-FPM)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vms_app
    restart: always
    environment:
      APP_NAME: "Visitor Management System"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "http://103.163.160.151"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: vms_db
      DB_USERNAME: vms_user
      DB_PASSWORD: PasswordVMS2026!
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      CACHE_STORE: database
    volumes:
      - app_public:/var/www/visitor-management-system/public
      - app_storage:/var/www/visitor-management-system/storage
    depends_on:
      - db
    networks:
      - vms_network

  # Service Container Web Server Nginx
  nginx:
    image: nginx:alpine
    container_name: vms_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - app_public:/var/www/visitor-management-system/public:ro
    depends_on:
      - app
    networks:
      - vms_network

  # Service Container Database MySQL
  db:
    image: mysql:8.0
    container_name: vms_db
    restart: always
    environment:
      MYSQL_DATABASE: vms_db
      MYSQL_USER: vms_user
      MYSQL_PASSWORD: PasswordVMS2026!
      MYSQL_ROOT_PASSWORD: RootPasswordVMS2026!
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - vms_network

volumes:
  app_public:
  app_storage:
  db_data:

networks:
  vms_network:
    driver: bridge
