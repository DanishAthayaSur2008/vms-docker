server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/visitor/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/visitor/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # browser kirim http:// ke port HTTPS (error 497) -> arahkan otomatis ke https://
    error_page 497 =301 https://$http_host$request_uri;

    root /var/www/html/public;
    index index.php;
    charset utf-8;
    server_tokens off;
    absolute_redirect off;

    client_max_body_size 8m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location ^~ /storage/ {
        alias /var/www/html/storage/app/public/;
        access_log off;
        add_header Cache-Control "public, max-age=86400";
    }

    location ^~ /build/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        set $upstream app:9000;
        fastcgi_pass $upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/html/public;
        fastcgi_hide_header X-Powered-By;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 16 16k;
        fastcgi_read_timeout 60s;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
