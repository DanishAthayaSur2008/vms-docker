# HTTPS di-terminate di VM 1; VM 1 mengirim X-Forwarded-Proto: https
map $http_x_forwarded_proto $fcgi_https {
    default off;
    https   on;
}

server {
    listen 80 default_server;
    server_name _;

    # IP klien asli dari X-Forwarded-For (hanya dipercaya dari VM 1 / gateway NAT / jaringan Docker)
    set_real_ip_from 10.22.0.0/24;
    set_real_ip_from 49.0.1.1;
    set_real_ip_from 103.18.78.203;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root /var/www/html/public;
    index index.php;
    charset utf-8;
    server_tokens off;
    absolute_redirect off;
    port_in_redirect off;

    client_max_body_size 8m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location ^~ /storage/ {
        alias /var/www/html/storage/app/public/;
        access_log off;
        add_header Cache-Control "public, max-age=86400";
    }

    location ^~ /build/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        set $upstream app:9000;
        fastcgi_pass $upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/html/public;
        fastcgi_param HTTPS           $fcgi_https;
        fastcgi_hide_header X-Powered-By;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 16 16k;
        fastcgi_read_timeout 60s;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
